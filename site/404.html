<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not a floor — STICKSPIRE</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500&display=swap">
<style>
/* Deliberately tiny: no video, no library, no analytics. A 404 is a signpost, and
   the fastest useful thing it can do is point back at the page that matters. */
:root{--ash:#0b0a0f;--chalk:#edebdb;--smoke:#8a8798;--ember:#fa8533}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;gap:1.1rem;
  padding:clamp(1.15rem,5vw,4.5rem);background:var(--ash);color:var(--chalk);
  font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;line-height:1.55}
p.eyebrow{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ember)}
h1{margin:0;font-family:"Anton",Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-weight:400;text-transform:uppercase;line-height:.92;
  font-size:clamp(2.2rem,1rem + 6vw,4.5rem);max-width:14ch}
p.say{margin:0;color:var(--smoke);max-width:44ch}
a{display:inline-block;margin-top:.5rem;padding:.85rem 1.6rem;background:var(--ember);
  color:#180f04;text-decoration:none;font-family:"Anton",sans-serif;font-size:1.05rem;
  letter-spacing:.06em;text-transform:uppercase}
a:hover{background:#ffa055}
a:focus-visible{outline:2px solid var(--chalk);outline-offset:3px}
</style>
</head>
<body>
  <p class="eyebrow">404</p>
  <h1>There is no floor here</h1>
  <p class="say">The tower has ten of them and this is not one. Whatever you were
  looking for has moved, or never existed.</p>
  <a href="/">Back to the tower</a>
</body>
</html>
